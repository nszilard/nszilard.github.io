role: Senior Software Engineer & Data Protection Officer
summary: |
  I am a Senior Software Engineer with a strong background in distributed systems, cloud infrastructure, and security-aware platform development. My foundation in computer networks and systems engineering was shaped through academic research at the Budapest University of Technology and Economics, where I worked on SDN and network coding as part of a research lab.

  I began my professional career at a London-based startup, where I was given end-to-end ownership of critical systems early on. This experience shaped my approach to engineering: pragmatic, responsibility-driven, and focused on building systems that are reliable, observable, and secure.

  Since then, I have worked in senior engineering and leadership roles across Sweden, spanning DevOps, platform engineering, and backend development. I have led teams, designed cloud-native architectures, and operated production systems at scale—while also serving as a Data Protection Officer, ensuring GDPR compliance and sound security practices.

  I enjoy working close to infrastructure, enabling developer productivity, and building systems that are both technically sound and easy to operate.

