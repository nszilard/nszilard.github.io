# Section information
section:
  name: Skills
  id: skills
  weight: 2
  background: light
  showOnNavbar: true
  template: section/skills

# Content
skills:
  - name: Cloud & Infrastructure
    icon: fas fa-cloud
    summary: |
      Extensive experience designing, operating, and securing cloud infrastructure primarily on AWS,
      with additional exposure to GCP and Azure.
      Strong background in networking, identity and access management, and infrastructure automation,
      with a focus on reliability, scalability, and cost awareness.

  - name: Go & Backend Engineering
    icon: fas fa-code
    summary: |
      Long-term experience building production-grade backend systems in Go.
      Comfortable designing APIs, background workers, and internal tooling with a strong focus on
      performance, observability, and maintainability.

  - name: Kubernetes & Platform Engineering
    icon: fas fa-dharmachakra
    summary: |
      Several years of hands-on experience operating Kubernetes clusters in production,
      including Kops-managed clusters and managed services such as EKS and GKE.
      Experienced in Helm-based application delivery, cluster upgrades, and platform-level troubleshooting.

  - name: Containers & Docker
    icon: fab fa-docker
    summary: |
      Deep experience with container-based workflows, including building, optimizing,
      and operating Docker images in production environments.
      Familiar with multi-stage and multi-architecture builds and container security best practices.

  - name: Observability & Monitoring
    icon: fas fa-search
    summary: |
      Strong expertise in building end-to-end observability stacks using Prometheus, Grafana, and related tooling.
      Experienced in writing recording rules, defining service-level metrics, and designing alerting strategies
      that balance signal quality and operational noise.

  - name: Linux & Automation
    icon: fas fa-terminal
    summary: |
      Daily user and operator of Linux in both professional and personal environments.
      Extensive experience maintaining cloud-hosted Linux systems and writing shell scripts
      to automate operational workflows and reduce manual toil.

  - name: Git & Collaboration
    icon: fab fa-git-alt
    summary: |
      Long-term experience working in Git-based development workflows across GitHub, GitLab, and Bitbucket.
      Comfortable with trunk-based development, pull request reviews, and repository-level access control.

  - name: Infrastructure as Code & Secrets Management
    icon: fas fa-toolbox
    summary: |
      Strong advocate of Infrastructure as Code with Terraform as the primary tool.
      Experienced in structuring reusable modules, managing state, and importing existing infrastructure.
      Familiar with Packer for image builds and Vault for identity-based secrets management.

  - name: CI/CD & Developer Tooling
    icon: fab fa-gg-circle
    summary: |
      Designed, built, and maintained CI/CD systems from scratch as well as at scale.
      Hands-on experience with Jenkins, CircleCI, Drone, GitLab CI, and GitHub Actions,
      with a focus on fast feedback loops, reliability, and developer experience.

  - name: Security & Compliance
    icon: fas fa-shield-alt
    summary: |
      Practical experience embedding security into platform and infrastructure design.
      Served as Data Protection Officer with responsibility for GDPR compliance,
      access control policies, vulnerability remediation, and secure operational practices.
